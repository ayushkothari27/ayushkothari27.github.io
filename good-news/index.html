<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Good News</title>
  <meta name="description" content="One uplifting story a day.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1A1A2E;
      --orange:  #C8572E;
      --yellow:  #C99A30;
      --green:   #3A8F72;
      --pink:    #B85C8A;
      --muted:   #9CA3AF;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.09);
      --text:    #F9FAFB;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100svh;
      overflow-x: hidden;
    }

    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.14;
      pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--yellow); top: -140px; right: -80px; animation: drift 8s ease-in-out infinite; }
    .blob-2 { width: 320px; height: 320px; background: var(--green);  bottom: -60px; left: -60px; animation: drift 11s ease-in-out infinite reverse; }
    .blob-3 { width: 220px; height: 220px; background: var(--pink);   top: 45%; right: 22%;      animation: drift 7s ease-in-out infinite 2s; }
    @keyframes drift {
      0%, 100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(28px,-18px) scale(1.05); }
      66%      { transform: translate(-18px,14px) scale(0.95); }
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: 620px; margin: 0 auto;
      min-height: 100svh;
      padding: 2.2rem 1rem 3rem;
      display: flex; flex-direction: column;
    }

    .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; color: var(--muted); }
    .top a { color: var(--muted); text-decoration: none; }
    .top a:hover { color: var(--text); }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem 0; }

    .kicker { font-size: 0.8rem; color: var(--yellow); font-weight: 500; letter-spacing: 0.02em; }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      line-height: 1.05; margin: 0.3rem 0 1.4rem;
    }
    h1 em { font-style: italic; font-weight: 400; color: var(--yellow); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden;
    }
    .card.enter { animation: enter 0.45s ease both; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }

    .hero {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: rgba(255,255,255,0.04);
    }
    .card-body { padding: 1.3rem 1.4rem 1.4rem; }
    .src { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; }
    .headline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.25rem, 3.6vw, 1.6rem); line-height: 1.25;
      color: var(--text); text-decoration: none; display: block;
    }
    .headline:hover { color: var(--yellow); }

    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.2rem; }
    .btn {
      font: inherit; font-size: 0.85rem; font-weight: 600;
      padding: 0.6rem 1.1rem; border-radius: 0.7rem;
      text-decoration: none; cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background .15s, color .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--yellow); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.25); }
    .btn:focus-visible, .headline:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

    .note { margin-top: 0.9rem; font-size: 0.75rem; color: var(--muted); min-height: 1em; }
    .empty { color: var(--muted); padding: 2rem 0; }

    footer { font-size: 0.72rem; color: var(--muted); line-height: 1.6; }
    footer a { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) { .blob, .card.enter { animation: none; } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrap">
    <div class="top">
      <a href="/">← ayush</a>
      <span id="date"></span>
    </div>

    <main>
      <p class="kicker">☀️ today's good news</p>
      <h1>one good <em>thing.</em></h1>
      <div id="slot"><p class="empty">Finding something nice…</p></div>
    </main>

    <footer>
      A new story every day, picked from <a href="https://www.reddit.com/r/UpliftingNews/" target="_blank" rel="noopener">r/UpliftingNews</a>
      and filtered for anything grim. <a href="https://github.com/ayushkothari27/ayushkothari27.github.io/tree/master/good-news">Source</a>
    </footer>
  </div>

  <script>
    const slot = document.getElementById('slot');
    const note = () => document.getElementById('note');
    const today = new Date();
    document.getElementById('date').textContent =
      today.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

    // Same story for everyone on a given day: hash the local date into the list.
    const dayKey = today.toLocaleDateString('en-CA'); // YYYY-MM-DD
    const hash = str => [...str].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

    const el = (tag, props = {}, ...kids) => {
      const n = Object.assign(document.createElement(tag), props);
      n.append(...kids.filter(Boolean));
      return n;
    };

    const host = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };

    let pool = [], idx = 0, extra = 0;

    function show(i, animate) {
      const s = pool[i];
      const url = s.article || s.link;
      let img = null;
      if (s.image) {
        img = el('img', { className: 'hero', src: s.image, alt: '', referrerPolicy: 'no-referrer' });
        img.onerror = () => img.remove();
      }
      const card = el('article', { className: 'card' + (animate ? ' enter' : '') },
        img,
        el('div', { className: 'card-body' },
          el('div', { className: 'src', textContent: s.article ? host(s.article) : s.source }),
          el('a', { className: 'headline', href: url, target: '_blank', rel: 'noopener', textContent: s.title }),
          el('div', { className: 'actions' },
            el('a', { className: 'btn btn-primary', href: url, target: '_blank', rel: 'noopener', textContent: 'Read the story →' }),
            el('button', { className: 'btn btn-ghost', type: 'button', id: 'more', textContent: 'One more ↻', onclick: another }),
            s.article && el('a', { className: 'btn btn-ghost', href: s.link, target: '_blank', rel: 'noopener', textContent: 'Discussion' })),
          el('p', { className: 'note', id: 'note' })));
      slot.replaceChildren(card);
    }

    function another() {
      extra++;
      idx = (idx + 1) % pool.length;
      show(idx, true);
      if (extra >= pool.length - 1) note().textContent = "That's all of them for now. Back to the first one.";
      else if (extra === 3) note().textContent = 'Greedy. We love it.';
    }

    fetch('feed.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(({ items }) => {
        if (!items?.length) throw new Error('empty');
        // Fixed order so the daily pick is stable through the day.
        pool = [...items].sort((a, b) => a.link < b.link ? -1 : 1);
        idx = hash(dayKey) % pool.length;
        show(idx, true);
      })
      .catch(() => {
        slot.replaceChildren(el('p', { className: 'empty', textContent: "Couldn't load today's story. Try again in a bit." }));
      });
  </script>
</body>
</html>
